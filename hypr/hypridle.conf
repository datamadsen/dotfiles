general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session; ~/.config/waybar/battery.py mark sleep    # lock before suspend; record charge for the battery tooltip.
    after_sleep_cmd = ~/.config/hypr/scripts/wake-display.sh; ~/.config/waybar/battery.py mark wake  # turn the display on (retrying until Hyprland is back); record charge.
}

listener {
    timeout = 300                      # 5min
    on-timeout = loginctl lock-session; ~/.config/waybar/battery.py mark away # lock screen when timeout has passed; start an "away" period
    on-resume = ~/.config/waybar/battery.py mark back                        # end the "away" period when activity is detected
}

listener {
    timeout = 330                                            # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'                   # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r # screen on when activity is detected
}

listener {
    timeout = 1800                                                                            # 30min
    on-timeout = [ "$(cat /sys/class/power_supply/AC0/online)" = 0 ] && systemctl suspend   # suspend when idle on battery; drop the test to also suspend on AC
}
