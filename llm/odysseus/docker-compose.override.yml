# Merged automatically by `docker compose` on top of docker-compose.yml.
# Installed by llm/install.sh as ~/.local/share/odysseus/docker-compose.override.yml
#
# Use the prebuilt image rather than building the Dockerfile locally.
# `docker compose pull odysseus` fetches it; `up` only builds if the pull
# never happened. The AMD GPU overlay is deliberately NOT used: it is
# ROCm-oriented and the models run on the host via llama-server anyway.
services:
  odysseus:
    image: ${ODYSSEUS_IMAGE:-ghcr.io/odysseus-dev/odysseus:latest}
