; llama-server model presets, used by llama-server.service (--models-preset).
; Keys are llama-server command-line flags without the leading dashes.
; Installed by llm/install.sh as ~/.config/llm/models.ini (per host: models.<hostname>.ini)
;
; Hardware notes (enterprise, desktop):
;   62 GiB RAM, 24 threads, GeForce RTX 3070 with 8 GiB VRAM.
;   Nothing useful fits entirely in VRAM, so mixture-of-experts models are
;   the way to go: attention and the shared layers live on the GPU, the
;   expert weights stay in RAM. llama-server's --fit (on by default) works
;   out n-gpu-layers / n-cpu-moe itself, as long as they are NOT set here.
;   Set n-cpu-moe explicitly only if a model fails to load.

[*]
; Global options every model inherits.
flash-attn = on
; 32k for coding agents (pi); the KV cache for Qwen3-30B-A3B is ~3 GB at
; this size, and --fit moves more expert weights to RAM to make room.
ctx-size = 32768
jinja = true
; Physical cores for the CPU side of the model (the box has 12C/24T).
threads = 12
; Leave this much VRAM free when --fit decides how many layers to offload.
; The card also drives the desktop, which needs ~2 GB (Hyprland, terminal,
; browsers). Less than that and apps start rendering garbage while a model
; is loaded. Generation is bound by RAM bandwidth anyway, so the extra
; experts on the CPU cost little.
fit-target = 2560
; Free the GPU after this much idle time; the next request reloads the model
; (a few seconds from page cache). Keeps VRAM available for the desktop.
sleep-idle-seconds = 600
; Hide a cache entry when a preset below already points at the same download.
dedup-cache-models = true

; --- Daily driver: 30B total / 3B active, ~18 GB, experts in RAM ----------
[qwen3-30b-a3b]
hf-repo = unsloth/Qwen3-30B-A3B-GGUF:Q4_K_M
load-on-startup = true

; Every preset below is listed by Odysseus and downloaded on first use, and
; Odysseus defaults to the first model alphabetically. Keep only models you
; have actually pulled enabled here, so a stray pick does not start a big
; download. To add one: uncomment it, then restart llama-server and request
; it once (curl or the Odysseus picker) to download it.

; --- Fast and small: 21B total / 3.6B active, ~12 GB ----------------------
[gpt-oss-20b]
hf-repo = ggml-org/gpt-oss-20b-GGUF

; --- gpt-oss-120b does not fit: ~63 GB on disk, this box has 62 GiB RAM.
